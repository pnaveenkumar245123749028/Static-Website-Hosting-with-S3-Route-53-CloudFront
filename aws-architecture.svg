<svg width="900" height="420" viewBox="0 0 900 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagramTitle diagramDesc">
  <title id="diagramTitle">AWS static website architecture diagram</title>
  <desc id="diagramDesc">A user requests the website, Route 53 routes to CloudFront, which reads from a private S3 bucket using OAC and serves the site over HTTPS.</desc>
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F5FFF"/>
      <stop offset="100%" stop-color="#12B9C2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1A2A4B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="420" fill="#F4F7FB"/>

  <g filter="url(#shadow)">
    <rect x="60" y="150" width="136" height="92" rx="18" fill="#FFFFFF" stroke="#DDE8F5"/>
    <text x="128" y="191" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#18212F">Visitor</text>
    <text x="128" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5F6F8B">Browser</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="260" y="150" width="176" height="92" rx="18" fill="#FFFFFF" stroke="#DDE8F5"/>
    <text x="348" y="191" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#18212F">Route 53</text>
    <text x="348" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5F6F8B">DNS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="500" y="120" width="182" height="154" rx="20" fill="url(#blueGrad)"/>
    <text x="591" y="170" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">CloudFront</text>
    <text x="591" y="197" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#EAF3FF">Edge cache</text>
    <text x="591" y="220" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#EAF3FF">HTTPS</text>
    <text x="591" y="243" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#EAF3FF">OAC + TLS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="740" y="150" width="118" height="92" rx="18" fill="#FFFFFF" stroke="#DDE8F5"/>
    <text x="799" y="191" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#18212F">S3</text>
    <text x="799" y="214" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5F6F8B">Private origin</text>
  </g>

  <path d="M196 196H260" stroke="#4D6ACF" stroke-width="4" stroke-linecap="round"/>
  <path d="M436 196H500" stroke="#4D6ACF" stroke-width="4" stroke-linecap="round"/>
  <path d="M682 196H740" stroke="#4D6ACF" stroke-width="4" stroke-linecap="round"/>
  <path d="M591 274V304H355V345H314" stroke="#12B9C2" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/>

  <g>
    <circle cx="314" cy="345" r="12" fill="#12B9C2"/>
    <text x="314" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF">OAC</text>
  </g>

  <text x="225" y="179" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#4D6ACF">Request</text>
  <text x="462" y="179" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#4D6ACF">Resolve</text>
  <text x="698" y="179" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#4D6ACF">Read</text>
  <text x="430" y="330" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#12B9C2">Private bucket access</text>
</svg>
